version: '3.8'

services:
  spark-master:
    image: bitnami/spark:3.4.2-debian-11-r10
    container_name: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - ./data:/app/data
    networks: # <--- ADD THIS
      - retail_lakehouse_network # <--- USE A CONSISTENT NETWORK NAME

  spark-worker-1:
    image: bitnami/spark:3.4.2-debian-11-r10
    container_name: spark-worker-1
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
    depends_on:
      - spark-master
    ports:
      - "8081:8081"
    volumes:
      - ./data:/app/data
    networks: # <--- ADD THIS
      - retail_lakehouse_network

  minio:
    image: minio/minio:RELEASE.2023-12-23T07-19-11Z
    container_name: minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks: # <--- ADD THIS
      - retail_lakehouse_network

  minio-client:
    image: minio/mc
    container_name: minio-client
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
        sleep 10; \
        mc alias set local http://minio:9000 admin password123 && \
        mc mb -p local/retail-lakehouse && \
        mc policy set download local/retail-lakehouse && \
        tail -f /dev/null"
    networks: # <--- ADD THIS
      - retail_lakehouse_network

  spark-app:
    build: .
    container_name: pyspark-etl-app
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      - spark-master
      - spark-worker-1
      - minio
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password123
    networks: # <--- ADD THIS
      - retail_lakehouse_network

  postgres:
    image: postgres:13
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    networks: # <--- ADD THIS
      - retail_lakehouse_network

  airflow-webserver:
    image: apache/airflow:2.8.1-python3.10
    container_name: airflow-webserver
    depends_on:
      - postgres
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__FERNET_KEY: 'qPt4eaBWueI7TXLWsprvhtnMNFpKU77UgG0VtTQlMX4=' # <--- UPDATE THIS!
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - /var/run/docker.sock:/var/run/docker.sock # This is essential for DockerOperator
      - .:/app
    ports:
      - "8089:8080"
    command: webserver
    restart: always
    networks: # <--- ADD THIS
      - retail_lakehouse_network

  airflow-scheduler:
    image: apache/airflow:2.8.1-python3.10
    container_name: airflow-scheduler
    depends_on:
      - postgres
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__FERNET_KEY: 'qPt4eaBWueI7TXLWsprvhtnMNFpKU77UgG0VtTQlMX4=' # <--- UPDATE THIS!
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - /var/run/docker.sock:/var/run/docker.sock # Essential for DockerOperator
      - .:/app
    command: scheduler
    restart: always
    networks: # <--- ADD THIS
      - retail_lakehouse_network

volumes:
  minio-data:
  postgres-db-volume:

networks: # <--- ADD THIS SECTION AT THE END OF THE FILE
  retail_lakehouse_network:
    driver: bridge # default driver for local setups